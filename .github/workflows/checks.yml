# Every gate this project has, run on every push and pull request.
#
# Why this exists: the browser checks could not run anywhere but the
# maintainer's machine. Playwright was resolved from a sibling repo that only
# exists in one person's folder layout, and the checks asked for real Chrome.
# So a cloud session, a pull request, or a new contributor could run `npm run
# check`, see it pass, and still have broken Arabic layout — because the four
# checks that actually look at the rendered page never ran.
#
# Playwright is now a devDependency here, and scripts/browser-lib.mjs falls
# back to bundled Chromium when Chrome is absent. Both of those exist so this
# file can work.
name: checks

on:
  push:
    branches: [main, release/staging-v1]
  pull_request:

# A second push to the same branch cancels the first: no point finishing a
# run against code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Payload signs admin sessions with this. There is no admin here — the
      # build only needs it to be present. Nothing secret is involved.
      PAYLOAD_SECRET: ci-build-only-not-a-secret
      # Empty DATABASE_URI makes payload.config.ts use a local SQLite file,
      # so CI provisions no database.
      DATABASE_URI: ""
      # No Chrome on a GitHub runner. Ask for bundled Chromium directly rather
      # than letting each check burn a launch timeout discovering that.
      PLAYWRIGHT_CHANNEL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # tsc, eslint, the design-system gate, Arabic parity.
      - name: Static checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Start the server
        run: |
          npx next start -p 3210 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:3210/ -o /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered on :3210"
          exit 1

      # The four that need a rendered page: article URLs, Arabic laid out
      # right-to-left, every dropdown reachable by mouse, and 70 pages at
      # three viewports.
      - name: Browser checks
        run: npm run check:live

      - name: Stop the server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  # ---------------------------------------------------------- notify-failure --
  # Slack, 2026-11-25: one message when CI fails on a push to a branch that
  # deploys (release/staging-v1 -> staging, main -> production), so the team
  # knows why a deploy is held back. Passing runs and pull requests send
  # nothing; deploy results come from the Vercel Slack app and a Railway
  # webhook. The message logic is scripts/notify-slack.sh, the same in all
  # three repos. It never fails: the run's result is the jobs above.
  notify-failure:
    name: notify Slack on failure
    needs: [check]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_PROD: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
          SLACK_WEBHOOK_URL_TEST: ${{ secrets.SLACK_WEBHOOK_URL_TEST }}
          NOTIFY_TEST: "0"
        run: bash scripts/notify-slack.sh
